name: E2E

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  chromium:
    runs-on: ubuntu-latest
    env:
      # 固定指到本機閉掉的埠，避免工作流程讀到正式 DATABASE_URL。
      # Playwright 啟動 API 時會再覆寫成連不上的位址；本章測試的瀏覽器也不開 WebSocket。
      DATABASE_URL: postgresql+asyncpg://127.0.0.1:9/creafly_e2e_do_not_use
      TEST_DATABASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: uv
        uses: astral-sh/setup-uv@v5

      - name: 安裝
        run: pnpm install --frozen-lockfile

      - name: Chromium
        run: pnpm --filter @creafly/simulator exec playwright install --with-deps chromium

      - name: 既有 smoke 與第二三章
        run: pnpm --filter @creafly/simulator exec playwright test --project=chromium
